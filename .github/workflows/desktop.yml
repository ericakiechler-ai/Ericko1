# Builds real Windows and macOS installers on real runners.
#
# Cross-compiling Tauri from Linux is not practical, so this workflow is the
# supported way to produce something you can actually sell. It runs on a tag.
name: Desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release under this tag (e.g. v1.1.0). Leave blank to only build."
        required: false
        default: ""

permissions:
  contents: write     # the release job attaches installers to a GitHub Release

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install && npx playwright install --with-deps chromium
      # A build that has not passed the calculation and licence tests must never
      # reach a customer, so this gates everything below it.
      # Throwaway keypair for the test run only: overwrites keys/public-key.b64 in
      # the CI workspace so the minted test licences match the build under test.
      - run: |
          node tools/make-keys.mjs
          node build.mjs
          node tools/make-licence.mjs --org "Northgate Power Services" --site "Calgary Operations" --seats 12 --id LIC-2026-DAF43F --maint 2027-09-07
          node tools/make-licence.mjs --org "Demo Expired" --seats 3 --expires 2020-01-01 --no-maint --id LIC-2026-EXP
          node tests/run.mjs

  bundle:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: '' }
          - { os: macos-latest,   target: '--target universal-apple-darwin' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './desktop/src-tauri -> target' }

      # The installer ships the EVALUATION build, embedding the committed public
      # key. No secret is needed and no customer licence ever enters CI. Licensed
      # copies are minted locally, where the private key lives.
      - name: Build the evaluation HTML
        shell: bash
        run: |
          node build.mjs
          cp dist/845-VEC-unlicensed.html desktop/frontend/index.html

      - name: Icons and bundle
        working-directory: desktop
        run: |
          npm install
          npx tauri icon icon.png
          npx tauri build ${{ matrix.target }}
        # To sign, add these secrets and uncomment:
        # env:
        #   TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        #   APPLE_ID: ${{ secrets.APPLE_ID }}
        #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.msi
            desktop/src-tauri/target/**/release/bundle/**/*.exe
            desktop/src-tauri/target/**/release/bundle/**/*.dmg

  # On a version tag, gather everything a customer or tester downloads into one
  # GitHub Release. Artifacts expire after 90 days; a Release is permanent and
  # has a stable URL you can put in an email.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node build.mjs
      - uses: actions/download-artifact@v4
        with: { path: installers }
      - name: Collect release files
        run: |
          mkdir -p out
          find installers -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) -exec cp {} out/ \;
          cp dist/845-VEC-unlicensed.html out/845-VEC-evaluation.html
          cp dist/845-VEC-setup-guide.html out/845-VEC-setup-guide.html
          cd out && sha256sum * | tee SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: 845-VEC ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            **Evaluation builds — unsigned.** Every calculation is live and identical to a
            licensed copy; exported test sheets are stamped as evaluation output.

            - `845-VEC_*_x64-setup.exe` — Windows installer (NSIS, per-machine)
            - `845-VEC_*_x64_en-US.msi` — Windows installer (MSI, for IT deployment)
            - `845-VEC_*_universal.dmg` — macOS, Apple Silicon and Intel
            - `845-VEC-evaluation.html` — the same tool as a single file, no install
            - `845-VEC-setup-guide.html` — customer setup guide
            - `SHA256SUMS.txt` — verify what you downloaded

            Unsigned: Windows SmartScreen will show *"Windows protected your PC"* —
            click **More info → Run anyway**. macOS will require right-click → Open.
            Signing is the next release step.
